<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ليث أبو كرم | صيانة وبرمجة</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: #f8fafc;
      background: linear-gradient(-45deg, #090d16, #0f172a, #111827, #0c243c);
      background-size: 400% 400%;
      animation: bgMove 14s ease infinite;
      padding: 16px;
    }

    @keyframes bgMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    #intro {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: #070b14;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
    }

    #intro h2 {
      font-size: 30px;
      color: #38bdf8;
      margin: 0 0 12px;
    }

    #intro p {
      color: #cbd5e1;
      max-width: 420px;
      margin: 0 0 22px;
      line-height: 1.6;
    }

    #intro button {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #fff;
      border: none;
      padding: 13px 28px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .app-card {
      width: 100%;
      max-width: 430px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .brand-title {
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      margin: 0 0 14px;
      color: #f8fafc;
    }

    #displayBox {
      min-height: 190px;
      max-height: 360px;
      overflow-y: auto;
      background: #0b1324;
      border: 1.5px solid #38bdf8;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 16px;
      line-height: 1.7;
    }

    .welcome-msg {
      text-align: center;
      color: #e2e8f0;
      padding: 36px 8px;
      font-size: 15px;
    }

    .btn-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu-btn {
      width: 100%;
      padding: 13px 16px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
    }

    .btn-screens { background: linear-gradient(135deg, #f472b6, #ec4899); }
    .btn-order { background: linear-gradient(135deg, #f43f5e, #e11d48); }
    .btn-maint { background: linear-gradient(135deg, #fbbf24, #d97706); color: #0f172a; }
    .btn-soft { background: linear-gradient(135deg, #34d399, #059669); }
    .btn-contact { background: linear-gradient(135deg, #a78bfa, #7c3aed); }
    .btn-welcome { background: linear-gradient(135deg, #38bdf8, #0284c7); }

    .search-input, .form-input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 10px;
      border-radius: 10px;
      border: 1px solid #38bdf8;
      background: #0f172a;
      color: #f8fafc;
      font-size: 14px;
    }

    .filter-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .filter-chip {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 12px;
      cursor: pointer;
    }

    .filter-chip.active {
      background: #38bdf8;
      color: #090d16;
      font-weight: bold;
      border-color: #38bdf8;
    }

    .screen-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: #111c33;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 10px;
      padding: 9px 12px;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .cost-badge {
      background: rgba(56, 189, 248, 0.16);
      color: #38bdf8;
      padding: 3px 9px;
      border-radius: 8px;
      font-weight: bold;
      white-space: nowrap;
      font-size: 13px;
    }

    .submit-order-btn {
      width: 100%;
      padding: 11px;
      background: #22c55e;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .status-note {
      margin-top: 8px;
      font-size: 12px;
      color: #fbbf24;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="intro">
    <h2>ليث أبو كرم</h2>
    <p>منصة أسعار الشاشات، خدمات الصيانة والبرمجة، وطلب التوصيل المباشر.</p>
    <button type="button" onclick="document.getElementById('intro').remove();">دخول إلى الواجهة</button>
  </div>

  <div class="app-card">
    <h1 class="brand-title">ليث أبو كرم</h1>

    <div id="displayBox">
      <div class="welcome-msg">أهلاً بك! اختر القسم لعرض التفاصيل أو أسعار الشاشات.</div>
    </div>

    <div class="btn-list">
      <button type="button" class="menu-btn btn-screens" onclick="window.openScreens()">أسعار شاشات الأجهزة كافة 📱</button>
      <button type="button" class="menu-btn btn-order" onclick="window.openOrderForm()">طلب شاشة وتوصيل 🛵</button>
      <button type="button" class="menu-btn btn-maint" onclick="window.openMaintenance()">صيانة الموبايلات</button>
      <button type="button" class="menu-btn btn-soft" onclick="window.openSoftware()">البرمجة والأنظمة</button>
      <button type="button" class="menu-btn btn-contact" onclick="window.openContact()">رقم الموبايل والتواصل</button>
      <button type="button" class="menu-btn btn-welcome" onclick="window.showWelcome()">ترحيب</button>
    </div>
  </div>

  <script>
    window.MY_WHATSAPP_NUMBER = "9647755996588";

    window.screensList = [
      { brand: "Samsung", name: "Samsung A12 / A13", price: "20,000 د.ع" },
      { brand: "Samsung", name: "Samsung M12", price: "22,000 د.ع" },
      { brand: "Samsung", name: "Samsung A24 / A34", price: "45,000 د.ع" },
      { brand: "Samsung", name: "Samsung Note 20 Ultra", price: "110,000 د.ع" },
      { brand: "iPhone", name: "iPhone X / XS", price: "35,000 د.ع" },
      { brand: "iPhone", name: "iPhone 11", price: "30,000 د.ع" },
      { brand: "iPhone", name: "iPhone 12 / 12 Pro", price: "45,000 د.ع" },
      { brand: "Redmi", name: "Redmi Note 11 / 12", price: "25,000 د.ع" },
      { brand: "Redmi", name: "Redmi 12C / 13C", price: "20,000 د.ع" }
    ];

    window.currentBrand = "الكل";

    window.showWelcome = function () {
      document.getElementById("displayBox").innerHTML =
        '<div class="welcome-msg">أهلاً بك! اختر القسم لعرض التفاصيل أو أسعار الشاشات.</div>';
    };

    window.openScreens = function () {
      window.currentBrand = "الكل";
      document.getElementById("displayBox").innerHTML = `
        <input id="screenSearch" class="search-input" type="text" placeholder="ابحث عن موديل الجهاز أو الشاشة..." oninput="window.renderScreens()" />
        <div class="filter-row" id="brandFilters">
          <button type="button" class="filter-chip active" onclick="window.selectBrand('الكل', this)">الكل</button>
          <button type="button" class="filter-chip" onclick="window.selectBrand('Samsung', this)">Samsung</button>
          <button type="button" class="filter-chip" onclick="window.selectBrand('iPhone', this)">iPhone</button>
          <button type="button" class="filter-chip" onclick="window.selectBrand('Redmi', this)">Redmi</button>
        </div>
        <div id="screensResults"></div>
      `;
      window.renderScreens();
    };

    window.selectBrand = function (brand, btnEl) {
      window.currentBrand = brand;
      document.querySelectorAll(".filter-chip").forEach((chip) => chip.classList.remove("active"));
      if (btnEl) btnEl.classList.add("active");
      window.renderScreens();
    };

    window.renderScreens = function () {
      const inputEl = document.getElementById("screenSearch");
      const resultsEl = document.getElementById("screensResults");
      if (!resultsEl) return;

      const query = inputEl ? inputEl.value.trim().toLowerCase() : "";
      const filtered = window.screensList.filter((item) => {
        const matchBrand = window.currentBrand === "الكل" || item.brand === window.currentBrand;
        const matchQuery =
          !query ||
          item.name.toLowerCase().includes(query) ||
          item.brand.toLowerCase().includes(query) ||
          item.price.toLowerCase().includes(query);
        return matchBrand && matchQuery;
      });

      if (!filtered.length) {
        resultsEl.innerHTML = '<div class="welcome-msg">لا توجد نتائج مطابقة للبحث.</div>';
        return;
      }

      resultsEl.innerHTML = filtered
        .map(
          (item) => `
          <div class="screen-item">
            <span>${item.name}</span>
            <span class="cost-badge">${item.price}</span>
          </div>
        `
        )
        .join("");
    };

    window.openMaintenance = function () {
      document.getElementById("displayBox").innerHTML = `
        <h3 style="margin:0 0 8px;color:#fbbf24;">قسم صيانة الموبايلات</h3>
        <p style="margin:0;color:#e2e8f0;">
          • تبديل شاشات بمختلف الجودات.<br/>
          • تبديل بطاريات وقواعد شحن.<br/>
          • فحص وتنظيف البوردات ومعالجة أعطال التشغيل.
        </p>
      `;
    };

    window.openSoftware = function () {
      document.getElementById("displayBox").innerHTML = `
        <h3 style="margin:0 0 8px;color:#34d399;">قسم البرمجة والأنظمة</h3>
        <p style="margin:0;color:#e2e8f0;">
          • تفليش وتحديث أنظمة الهواتف.<br/>
          • حل مشاكل التعليق وإعادة ضبط المصنع.<br/>
          • إعداد الأنظمة والبرامج للأجهزة.
        </p>
      `;
    };

    window.openContact = function () {
      document.getElementById("displayBox").innerHTML = `
        <h3 style="margin:0 0 8px;color:#a78bfa;">رقم الموبايل والتواصل</h3>
        <p style="margin:0;color:#e2e8f0;">
          رقم الموبايل: <strong>07755996588</strong><br/>
          للطلب والاستفسار المباشر استخدم زر <strong>طلب شاشة وتوصيل</strong>.
        </p>
      `;
    };

    window.openOrderForm = function (prefilledScreen) {
      const box = document.getElementById("displayBox");
      box.innerHTML = `
        <div>
          <h3 style="margin:0 0 10px;color:#38bdf8;text-align:center;">طلب شاشة وتوصيل 🛵</h3>
          <input id="custName" class="form-input" type="text" placeholder="الاسم الكامل" />
          <input id="screenModel" class="form-input" type="text" placeholder="نوع الجهاز / الشاشة المطلوبة" value="${prefilledScreen || ""}" />
          <input id="custPhone" class="form-input" type="tel" placeholder="رقم الموبايل" />
          <input id="custAddress" class="form-input" type="text" placeholder="العنوان بالتفصيل (المنطقة / أقرب نقطة دالة)" />
          <button type="button" class="submit-order-btn" onclick="window.sendOrderWhatsApp()">إرسال الطلب عبر واتساب ✅</button>
          <div id="orderStatus" class="status-note"></div>
        </div>
      `;
    };

    window.sendOrderWhatsApp = function () {
      const name = document.getElementById("custName").value.trim();
      const screen = document.getElementById("screenModel").value.trim();
      const phone = document.getElementById("custPhone").value.trim();
      const address = document.getElementById("custAddress").value.trim();
      const statusEl = document.getElementById("orderStatus");

      if (!name || !screen || !phone || !address) {
        if (statusEl) statusEl.textContent = "يرجى ملء الاسم، نوع الشاشة، رقم الموبايل، والعنوان.";
        return;
      }

      const cleanPhone = String(window.MY_WHATSAPP_NUMBER).replace(/\D/g, "");
      const message =
        "مرحباً ليث أبو كرم، أرغب بطلب شاشة:\n" +
        "الاسم: " + name + "\n" +
        "الشاشة المطلوبة: " + screen + "\n" +
        "رقم الموبايل: " + phone + "\n" +
        "العنوان: " + address;

      const url = "https://wa.me/" + cleanPhone + "?text=" + encodeURIComponent(message);
      window.location.href = url;;
      if (statusEl) {
        statusEl.style.color = "#4ade80";
        statusEl.textContent = "تم تجهيز الطلب وفتح واتساب للإرسال.";
      }
    };
  </script>
</body>
</html>
